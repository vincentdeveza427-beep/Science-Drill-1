<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Drills - Home</title>
<style>
:root{
  --bg1:#071b2e; --bg2:#0d2b45; --accent:#28e0c5; --accent2:#5aa9ff;
  --card:#0f2740; --card-border:#1c3f5e; --text:#eaf6ff; --muted:#9db4c7;
  --amber:#ffcc66;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 20% 10%, #123456 0%, var(--bg1) 45%, #050f1a 100%);
  color:var(--text); min-height:100vh; padding-bottom:60px;
}
header{padding:36px 20px 22px; text-align:center; position:relative; overflow:hidden;}
header::before{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(2px 2px at 10% 20%, #fff, transparent),
    radial-gradient(2px 2px at 80% 30%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 60% 70%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 30% 80%, #fff, transparent),
    radial-gradient(2px 2px at 90% 85%, #fff, transparent);
  opacity:.25; pointer-events:none;
}
header h1{
  margin:0; font-size:clamp(1.8rem,5vw,2.8rem); letter-spacing:.5px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text; background-clip:text; color:transparent; position:relative;
}
header p{color:var(--muted); margin:10px 0 0; font-size:1rem; position:relative;}

.wrap{max-width:900px; margin:0 auto; padding:0 16px;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-top:20px;}

.set-card{
  display:flex; flex-direction:column; gap:10px; text-decoration:none; color:inherit;
  background:var(--card); border:1px solid var(--card-border); border-radius:16px;
  padding:22px; transition:transform .15s, border-color .15s, box-shadow .15s;
}
a.set-card:hover{
  transform:translateY(-3px); border-color:var(--accent);
  box-shadow:0 6px 18px rgba(40,224,197,.25);
}
.set-card.soon{opacity:.55; cursor:default;}
.badge{
  align-self:flex-start; font-size:.75rem; font-weight:700; padding:4px 10px; border-radius:20px;
  background:rgba(90,169,255,.15); color:var(--accent2); border:1px solid rgba(90,169,255,.4);
}
.set-card.soon .badge{background:rgba(255,204,102,.1); color:var(--amber); border-color:rgba(255,204,102,.4);}
.set-card h2{margin:0; font-size:1.2rem;}
.set-card p{margin:0; color:var(--muted); font-size:.9rem; line-height:1.5;}
.start{
  margin-top:auto; padding-top:6px; font-weight:700; font-size:.9rem; color:var(--accent);
}
footer{text-align:center; color:var(--muted); font-size:.8rem; padding:30px 20px; opacity:.6;}
</style>
</head>
<body>

<header>
  <h1>Science Drills</h1>
  <p>Choose a drill set to begin</p>
</header>

<div class="wrap">
  <div class="grid" id="setGrid"></div>
</div>

<footer>Science Drill Reviewer</footer>

<script>
// ============================================================
// ADD NEW DRILL SETS HERE.
// Copy one block, change the details, and set "href" to the
// new drill's HTML file. Leave href as "" to show "Coming soon".
// ============================================================
const SETS = [
  {
    title: "Set A",
    badge: "150 questions",
    description: "Earth Science, Astronomy and Physics.",
    href: "science-drill-1.html"
  },
  {
    title: "Set B",
    badge: "150 questions",
    description: "Physics, Chemistry and Biology.",
    href: "science-drill-2.html"
  },
  {
    title: "Set C",
    badge: "150 questions",
    description: "Biology, Earth Science, Astronomy, Physics and Chemistry.",
    href: "science-drill-3.html"
  },
  {
    title: "Set D",
    badge: "150 questions",
    description: "Coming Soon",
    href: ""
  },
];

const grid = document.getElementById('setGrid');
SETS.forEach(function(s){
  const available = !!s.href;
  const card = document.createElement(available ? 'a' : 'div');
  card.className = 'set-card' + (available ? '' : ' soon');
  if(available) card.href = s.href;

  const badge = document.createElement('span');
  badge.className = 'badge';
  badge.textContent = s.badge;
  card.appendChild(badge);

  const h = document.createElement('h2');
  h.textContent = s.title;
  card.appendChild(h);

  const p = document.createElement('p');
  p.textContent = s.description;
  card.appendChild(p);

  if(available){
    const go = document.createElement('div');
    go.className = 'start';
    go.textContent = 'Start drill \u2192';
    card.appendChild(go);
  }
  grid.appendChild(card);
});
</script>
</body>
</html>
