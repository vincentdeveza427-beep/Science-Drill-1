<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard Mode - Science Drill</title>
<style>
:root{
  --bg1:#071b2e; --accent:#28e0c5; --accent2:#5aa9ff;
  --card:#0f2740; --card-border:#1c3f5e; --text:#eaf6ff; --muted:#9db4c7;
  --correct:#2ecc71; --wrong:#ff5f6d; --amber:#ffcc66;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);min-height:100vh;padding-bottom:50px;
  background:radial-gradient(circle at 20% 10%, #123456 0%, var(--bg1) 45%, #050f1a 100%);}
.hidden{display:none !important;}
.wrap{max-width:760px;margin:0 auto;padding:0 16px;}
header{padding:22px 16px 10px;text-align:center;}
header h1{margin:0;font-size:clamp(1.4rem,4vw,2rem);background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
header p{color:var(--muted);margin:6px 0 0;font-size:.92rem;}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px;}
.top a{color:var(--accent);text-decoration:none;font-weight:700;font-size:.88rem;}
.stats{color:var(--muted);font-size:.85rem;}
.bar{height:8px;background:#0a2033;border-radius:6px;overflow:hidden;border:1px solid var(--card-border);margin-bottom:14px;}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s;}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px;}
.chip{background:transparent;color:var(--accent);border:1.5px solid var(--accent);border-radius:30px;padding:7px 14px;font-weight:700;font-size:.82rem;cursor:pointer;}
.chip.on{background:rgba(40,224,197,.15);}
.scene{perspective:1200px;}
.card{display:grid;transform-style:preserve-3d;transition:transform .45s;cursor:pointer;min-height:320px;}
.card.flipped{transform:rotateY(180deg);}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;}
.face.back{transform:rotateY(180deg);border-color:rgba(46,204,113,.5);box-shadow:0 0 0 1px rgba(46,204,113,.2) inset;}
.tag{align-self:flex-start;font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(90,169,255,.15);color:var(--accent2);border:1px solid rgba(90,169,255,.4);}
.back .tag{background:rgba(46,204,113,.12);color:var(--correct);border-color:rgba(46,204,113,.4);}
.q{font-size:1.05rem;line-height:1.55;font-weight:600;}
.qsmall{font-size:.88rem;line-height:1.5;color:var(--muted);}
.opts{display:flex;flex-direction:column;gap:7px;margin-top:4px;}
.opt{display:flex;gap:10px;align-items:center;background:#0a1e33;border:1px solid var(--card-border);border-radius:10px;padding:9px 12px;font-size:.92rem;}
.opt b{flex:none;width:24px;height:24px;border-radius:50%;background:#132c45;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--muted);}
.ans{background:rgba(46,204,113,.12);border:1px solid var(--correct);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;font-size:1.05rem;font-weight:700;}
.ans b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--correct);color:#04220f;display:flex;align-items:center;justify-content:center;}
.hint{margin-top:auto;color:var(--muted);font-size:.78rem;text-align:center;}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px;}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04222f;border:none;padding:11px 20px;border-radius:30px;font-weight:700;font-size:.92rem;cursor:pointer;}
.btn.secondary{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}
.btn.good{background:var(--correct);color:#04220f;}
.btn.again{background:transparent;color:var(--amber);border:1.5px solid var(--amber);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.msg{text-align:center;color:var(--muted);padding:60px 10px;}
.msg a{color:var(--accent);}
.mark{position:absolute;}
@media(max-width:480px){.q{font-size:1rem;}.btn{padding:10px 14px;font-size:.85rem;}}
</style>
</head>
<body>
<header>
  <h1 id="title">Flashcards</h1>
  <p>Study mode. No timer and no score is recorded.</p>
</header>
<div class="wrap">
  <div class="top"><a href="index.html">&larr; Home</a><span class="stats" id="stats"></span></div>
  <div id="loading" class="msg">Loading cards...</div>
  <div id="error" class="msg hidden"><b id="errTitle">Could not load this drill.</b><br><span id="errDetail"></span><br><br><a href="index.html">Back to homepage</a></div>
  <div id="app" class="hidden">
    <div class="bar"><i id="fill"></i></div>
    <div class="tools">
      <button class="chip" id="shuffleBtn">Shuffle</button>
      <button class="chip" id="reviewBtn">Review only</button>
      <button class="chip" id="resetBtn">Clear marks</button>
    </div>
    <div id="empty" class="msg hidden">No cards to show here. Nice work! <br><a href="#" id="showAll">Show all cards</a></div>
    <div id="deck">
      <div class="scene"><div class="card" id="card">
        <div class="face front">
          <span class="tag" id="fTag"></span>
          <div class="q" id="fQ"></div>
          <div class="opts" id="fOpts"></div>
          <div class="hint">Tap the card to see the answer</div>
        </div>
        <div class="face back">
          <span class="tag" id="bTag"></span>
          <div class="qsmall" id="bQ"></div>
          <div class="ans"><b id="bLetter"></b><span id="bText"></span></div>
          <div class="hint">Tap the card to flip back</div>
        </div>
      </div></div>
      <div class="nav">
        <button class="btn secondary" id="prevBtn">&larr; Prev</button>
        <button class="btn again" id="againBtn">Still learning</button>
        <button class="btn good" id="knowBtn">Got it</button>
        <button class="btn secondary" id="nextBtn">Next &rarr;</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var setFile = params.get('set') || '';
  var valid = /^science-drill-\d+\.html$/.test(setFile);
  var letters = ['A','B','C','D'];
  var KEY = 'sd_flash_' + setFile;
  function $(id){ return document.getElementById(id); }
  function fail(why){
    $('loading').classList.add('hidden'); $('error').classList.remove('hidden');
    var msg = {
      link: 'This link has no valid drill set. Open the homepage, choose Flashcard Mode, then pick a set.',
      file: 'Flashcards cannot load when the page is opened straight from a folder (file://). Open the website address instead (for example your GitHub Pages link).',
      missing: 'The drill file for this set was not found. Make sure that set\'s HTML file (science-drill-N.html) is uploaded in the same folder.',
      parse: 'The drill file loaded but its questions could not be read.'
    };
    $('errDetail').textContent = msg[why] || msg.parse;
  }
  if(!valid){ fail('link'); return; }
  if(location.protocol === 'file:'){ fail('file'); return; }
  var setLetter = String.fromCharCode(64 + parseInt(setFile.match(/\d+/)[0], 10));
  $('title').textContent = 'Flashcards - Set ' + setLetter;
  document.title = 'Flashcards - Set ' + setLetter;

  var Q = [], marks = {}, order = [], pos = 0, reviewOnly = false;

  function loadMarks(){ try{ marks = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ marks = {}; } }
  function saveMarks(){ try{ localStorage.setItem(KEY, JSON.stringify(marks)); }catch(e){} }

  function extract(html){
    var m = html.match(/const QUESTIONS\s*=\s*(\[[\s\S]*?\]);\s*\n\s*const letters/);
    if(!m) m = html.match(/const QUESTIONS\s*=\s*(\[[\s\S]*\]);/);
    if(!m) return null;
    try{ return (new Function('return ' + m[1]))(); }catch(e){ return null; }
  }

  fetch(setFile).then(function(r){ if(!r.ok) throw 'missing'; return r.text(); }).then(function(html){
    Q = extract(html);
    if(!Q || !Q.length) throw 'parse';
    loadMarks();
    $('loading').classList.add('hidden');
    $('app').classList.remove('hidden');
    buildOrder(false);
    render();
  }).catch(function(e){ fail(typeof e === 'string' ? e : 'missing'); });

  function buildOrder(shuffle){
    var idx = [];
    for(var i = 0; i < Q.length; i++){
      if(reviewOnly && marks[i] !== 'again') continue;
      idx.push(i);
    }
    if(shuffle){
      for(var j = idx.length - 1; j > 0; j--){
        var k = Math.floor(Math.random() * (j + 1)); var t = idx[j]; idx[j] = idx[k]; idx[k] = t;
      }
    }
    order = idx; pos = 0;
  }

  function counts(){
    var known = 0, again = 0;
    for(var i = 0; i < Q.length; i++){ if(marks[i] === 'known') known++; else if(marks[i] === 'again') again++; }
    return { known: known, again: again };
  }

  function render(){
    var c = counts();
    $('stats').textContent = c.known + ' known / ' + c.again + ' to review / ' + Q.length + ' cards';
    $('fill').style.width = (c.known / Q.length * 100) + '%';
    $('reviewBtn').classList.toggle('on', reviewOnly);
    $('reviewBtn').textContent = reviewOnly ? 'Showing: review only' : 'Review only';
    var has = order.length > 0;
    $('deck').classList.toggle('hidden', !has);
    $('empty').classList.toggle('hidden', has);
    if(!has) return;
    var i = order[pos], q = Q[i], correct = q[2];
    $('card').classList.remove('flipped');
    var tag = 'Question ' + (i + 1) + '  -  card ' + (pos + 1) + ' of ' + order.length;
    $('fTag').textContent = tag; $('bTag').textContent = 'Answer';
    $('fQ').innerHTML = q[0]; $('bQ').innerHTML = q[0];
    var o = '';
    for(var k = 0; k < q[1].length; k++){ o += '<div class="opt"><b>' + letters[k] + '</b><span>' + q[1][k] + '</span></div>'; }
    $('fOpts').innerHTML = o;
    $('bLetter').textContent = letters[correct];
    $('bText').innerHTML = q[1][correct];
    $('prevBtn').disabled = pos === 0;
    $('nextBtn').disabled = pos >= order.length - 1;
  }

  function flip(){ $('card').classList.toggle('flipped'); }
  function go(d){
    var n = pos + d;
    if(n < 0 || n >= order.length) return;
    pos = n; render();
  }
  function mark(v){
    if(!order.length) return;
    marks[order[pos]] = v; saveMarks();
    if(reviewOnly && v === 'known'){
      // card leaves the review pile; stay on the next one
      order.splice(pos, 1);
      if(pos >= order.length) pos = Math.max(0, order.length - 1);
      render();
    } else if(pos < order.length - 1){
      pos++; render();
    } else { render(); }
  }

  $('card').onclick = flip;
  $('prevBtn').onclick = function(){ go(-1); };
  $('nextBtn').onclick = function(){ go(1); };
  $('knowBtn').onclick = function(){ mark('known'); };
  $('againBtn').onclick = function(){ mark('again'); };
  $('shuffleBtn').onclick = function(){ buildOrder(true); render(); };
  $('reviewBtn').onclick = function(){ reviewOnly = !reviewOnly; buildOrder(false); render(); };
  $('showAll').onclick = function(e){ e.preventDefault(); reviewOnly = false; buildOrder(false); render(); };
  $('resetBtn').onclick = function(){
    if(!confirm('Clear all Got it / Still learning marks for this set?')) return;
    marks = {}; saveMarks(); buildOrder(false); render();
  };
  document.addEventListener('keydown', function(e){
    if(!order.length) return;
    if(e.key === 'ArrowRight') go(1);
    else if(e.key === 'ArrowLeft') go(-1);
    else if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); flip(); }
  });
})();
</script>
</body>
</html>
